<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface-2: #334155; --border: #475569;
    --text: #f1f5f9; --text-2: #cbd5e1; --text-3: #94a3b8;
    --primary: #3b82f6; --primary-hover: #2563eb;
    --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #06b6d4;
    --purple: #a855f7;
  }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header h1 span { color: var(--primary); }
  .header-meta { font-size: 12px; color: var(--text-3); }
  .header-actions { display: flex; gap: 8px; }

  /* Filter bar */
  .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-group label { font-size: 12px; font-weight: 500; color: var(--text-3); }
  select, input { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; }
  select:focus, input:focus { outline: none; border-color: var(--primary); }

  /* KPI Grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 24px 32px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
  .kpi-card.success::before { background: var(--success); }
  .kpi-card.warning::before { background: var(--warning); }
  .kpi-card.danger::before { background: var(--danger); }
  .kpi-card.info::before { background: var(--info); }
  .kpi-card.purple::before { background: var(--purple); }
  .kpi-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .kpi-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .kpi-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; margin-top: 6px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
  .kpi-trend.up { background: rgba(16,185,129,0.15); color: var(--success); }
  .kpi-trend.down { background: rgba(239,68,68,0.15); color: var(--danger); }
  .kpi-trend.flat { background: rgba(148,163,184,0.15); color: var(--text-3); }

  /* Main grid */
  .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; padding: 0 32px 24px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .chart-card .chart-sub { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }
  .chart-container { position: relative; height: 280px; }

  /* Alert feed */
  .alert-feed { max-height: 320px; overflow-y: auto; }
  .alert-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 8px; margin-bottom: 8px; background: var(--surface-2); border-left: 3px solid var(--warning); }
  .alert-item.critical { border-left-color: var(--danger); }
  .alert-item.info { border-left-color: var(--info); }
  .alert-item.success { border-left-color: var(--success); }
  .alert-icon { font-size: 16px; flex-shrink: 0; }
  .alert-content { flex: 1; }
  .alert-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .alert-desc { font-size: 11px; color: var(--text-3); }

  /* Table */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 0 32px 24px; }
  .table-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--surface-2); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-success { background: rgba(16,185,129,0.15); color: var(--success); }
  .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
  .badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); }

  /* Footer */
  .footer { text-align: center; padding: 20px; color: var(--text-3); font-size: 12px; border-top: 1px solid var(--border); }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; min-height: 400px; flex-direction: column; gap: 12px; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } .filter-bar { flex-direction: column; align-items: flex-start; } }
</style>

async function fetchCSV(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.text();
  } catch (e) {
    console.warn(`Failed to load ${url}:`, e.message);
    return null;
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/['"]/g, ''));
  return lines.slice(1).map(line => {
    // Simple CSV parse (assumes no quoted commas for now)
    const values = line.split(',');
    const row = {};
    headers.forEach((h, i) => row[h] = (values[i] || '').trim().replace(/^"|"$/g, ''));
    return row;
  });
}

    { type: 'critical', icon: '📦', title: 'SENG GAJAMADA Stock = 0', desc: 'SKU 05SGMB914 urgent — perlu order 100 unit (Rp 4.7jt).' },
    { type: 'warning', icon: '⏱️', title: 'OTIF masih 87.3%', desc: 'Target 95%. Gap 7.7pp = ~15 orders telat per 200 order.' },
    { type: 'warning', icon: '💰', title: '27% supplier CBD (8 vendor)', desc: 'Cash flow tekanan tinggi. Negosiasi → 14-30 hari untuk hemat ~Rp 8-15jt/bulan.' },
    { type: 'info', icon: '🏝️', title: '2 cabang tanpa PIC (KLK, CRK)', desc: 'Keduanya transfer-only, model bisnis harus di-eksplisitkan di sistem.' },
    { type: 'info', icon: '📊', title: 'Working capital Rp 485jt', desc: 'Modal tertahan di inventory. Turnover bisa dioptimasi 1-2x dengan SKU pruning.' },
  ];
  document.getElementById('alertFeed').innerHTML = alerts.map(a => `
    <div class="alert-item ${a.type}">
      <div class="alert-icon">${a.icon}</div>
      <div class="alert-content">
        <div class="alert-title">${a.title}</div>
        <div class="alert-desc">${a.desc}</div>
      </div>
    </div>
  `).join('');
}

function refreshData() {
  document.getElementById('lastUpdate').textContent = 'Refreshing...';
  setTimeout(() => {
    const now = new Date();
    document.getElementById('lastUpdate').textContent = 'Last update: ' + now.toLocaleString('id-ID');
    document.getElementById('footerUpdate').textContent = now.toLocaleString('id-ID');
  }, 800);
}

// Init
async function init() {
  // Try load data from CSV first
  const csvSources = {
    branches: 'templates/01_branches.csv',
    suppliers: 'templates/02_suppliers.csv',
    products: 'templates/03_products.csv',
    sales: 'templates/05_sales_history.csv',
    stock: 'templates/06_stock_snapshot.csv',
    po: 'templates/07_purchase_orders.csv',
    customers: 'templates/08_customers.csv'
  };
  const loaded = {};
  for (const [key, url] of Object.entries(csvSources)) {
    const text = await fetchCSV(url);
    if (text) loaded[key] = parseCSV(text);
  }
  // Update SIMULATED_METRICS from CSV if available
  if (loaded.sales && loaded.sales.length > 0) {
    const otifs = loaded.sales.map(r => parseFloat(r.otif_pct) || 0).filter(v => v > 0);
    const fills = loaded.sales.map(r => parseFloat(r.fill_rate_pct) || 0).filter(v => v > 0);
    if (otifs.length) SIMULATED_METRICS.otif = +(otifs.reduce((a,b)=>a+b,0) / otifs.length).toFixed(1);
    if (fills.length) SIMULATED_METRICS.fillRate = +(fills.reduce((a,b)=>a+b,0) / fills.length).toFixed(1);
  }
  if (loaded.stock && loaded.stock.length > 0) {
    const stockouts = loaded.stock.filter(r => r.status === 'urgent_stockout').length;
    SIMULATED_METRICS.stockoutRate = +(stockouts / loaded.stock.length * 100).toFixed(1);
    const dohs = loaded.stock.map(r => parseInt(r.days_of_cover) || 0).filter(v => v > 0);
    if (dohs.length) SIMULATED_METRICS.daysOnHand = Math.round(dohs.reduce((a,b)=>a+b,0) / dohs.length);
  }
  if (loaded.branches) SIMULATED_METRICS.branchCount = loaded.branches.length;
  if (loaded.suppliers) SIMULATED_METRICS.supplierCount = loaded.suppliers.length;

  // Mark data source
  if (Object.keys(loaded).length > 0) {
    document.getElementById('lastUpdate').textContent = `Loaded ${Object.keys(loaded).length} CSV • ${new Date().toLocaleString('id-ID')}`;
  }
  render();
  refreshData();
}
document.addEventListener('DOMContentLoaded', init);
